<header><div><small>致虚极 · 守静笃</small><h1>烟雨江南 / 空间诊断档案</h1><p>先把空间与建筑关系做对，再做少量高质量成片。</p></div><div class="tag">正式多机位渲染已暂停</div></header>

<div class="note"><p>2026-09-20 起，不再以补齐大量正式机位为目标。下面直接收录仓库已有渲染作为阶段页；新的迭代使用 10 个低成本诊断机位检查路径、尺度、构造和遮挡。</p></div>
