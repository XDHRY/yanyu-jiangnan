name: Offline Animated Model Preview
on:
  pull_request:
    branches: [main]
    paths: ['tools/live_preview/**','.github/workflows/live-preview.yml','jiangnan.py','textures/**','tools/web_materials.py','tools/web_material_factors.py','tools/procedural_palette53.py']
permissions:
  contents: read
  actions: read
jobs:
  offline-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Reuse successful same-head Web build without dispatching another build
        env:
          GH_TOKEN: ${{ github.token }}
          JN_HEAD: ${{ github.event.pull_request.head.sha }}
          JN_BRANCH: ${{ github.head_ref }}
        run: |
          python - <<'PY'
          import json,os,subprocess,time
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY'];head=os.environ['JN_HEAD'];branch=os.environ['JN_BRANCH']
          def get(path):return json.loads(subprocess.check_output(['gh','api',path]))
          deadline=time.monotonic()+1200
          while time.monotonic()<deadline:
              runs=get(f'repos/{repo}/actions/runs?per_page=100')['workflow_runs']
              candidates=[r for r in runs if r['name']=='Jiangnan Web 3D Viewer' and r['head_sha']==head and r['head_branch']==branch and r['event']=='pull_request']
              assert len(candidates)<=1,'Duplicate Web builds for same head; reconcile before preview'
              if candidates and candidates[0]['status']=='completed':
                  run=candidates[0];assert run['conclusion']=='success','Upstream Web build failed'
                  artifacts=get(f"repos/{repo}/actions/runs/{run['id']}/artifacts")['artifacts']
                  artifacts=[a for a in artifacts if a['name'].startswith('Jiangnan-Web-Viewer-') and not a['expired']]
                  assert len(artifacts)==1
                  artifact=artifacts[0]
                  subprocess.run(['gh','run','download',str(run['id']),'--repo',repo,'-n',artifact['name'],'-D','source-viewer'],check=True)
                  Path('source-viewer/workflow-source.json').write_text(json.dumps({'conclusion':run['conclusion'],'expected_head':head,'model_source':run['head_sha'],'web_run':run['id'],'artifact':artifact['id'],'artifact_digest':artifact.get('digest')}))
                  break
              time.sleep(20)
          else:raise RuntimeError('Same-head Web build not ready; no duplicate dispatch performed')
          PY
      - name: Build from unchanged verified model
        run: python tools/live_preview/build.py source-viewer live-delivery
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Test offline HTML, motion, pause, snow, navigation and mobile UI
        run: |
          node tools/live_preview/capture.cjs live-delivery
          python -m pip install Pillow --quiet --disable-pip-version-check
          python - <<'PY'
          from PIL import Image,ImageChops
          from pathlib import Path
          import json
          root=Path('live-delivery/runtime-proof')
          a=Image.open(root/'desktop-rain-a.png').convert('RGB')
          b=Image.open(root/'desktop-rain-b.png').convert('RGB')
          diff=ImageChops.difference(a,b)
          count=sum(max(rgb)>2 for rgb in diff.getdata())
          assert count>100,('no visible animation',count)
          (root/'motion-pixels.json').write_text(json.dumps({'passed':True,'changed_pixels_above_2':count,'total_pixels':a.width*a.height,'scope':'same camera actual screen motion, not FPS benchmark'}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Jiangnan-Offline-Live-Preview-${{ github.sha }}
          path: live-delivery/
          retention-days: 30
          if-no-files-found: error

