name: Offline Animated Model Preview
on:
  pull_request:
    branches: [main]
    paths: ['tools/live_preview/**','.github/workflows/live-preview.yml']
permissions:
  contents: read
  actions: read
jobs:
  offline-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 39396940527
          name: Jiangnan-Web-Viewer-6c310375fe261866f311d27e5f5cd8e2657266ca
          path: source-viewer
      - name: Build from unchanged verified model
        run: python tools/live_preview/build.py source-viewer live-delivery
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Test offline HTML, motion, pause, snow, navigation and mobile UI
        run: |
          node tools/live_preview/capture.cjs live-delivery
          python -m pip install Pillow --quiet --disable-pip-version-check
          python - <<'PY'
          from PIL import Image,ImageChops
          from pathlib import Path
          import json
          root=Path('live-delivery/runtime-proof')
          a=Image.open(root/'desktop-rain-a.png').convert('RGB')
          b=Image.open(root/'desktop-rain-b.png').convert('RGB')
          diff=ImageChops.difference(a,b)
          count=sum(max(rgb)>2 for rgb in diff.getdata())
          assert count>100,('no visible animation',count)
          (root/'motion-pixels.json').write_text(json.dumps({'passed':True,'changed_pixels_above_2':count,'total_pixels':a.width*a.height,'scope':'same camera actual screen motion, not FPS benchmark'}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Jiangnan-Offline-Live-Preview-${{ github.sha }}
          path: live-delivery/
          retention-days: 30
          if-no-files-found: error
