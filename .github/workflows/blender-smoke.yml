name: Blender 4.5 Scene Smoke

on:
  push:
    branches: [main]
    paths:
      - 'Jiangnan.blend'
      - 'jiangnan.py'
      - 'tools/**'
      - 'textures/**'
      - '.github/workflows/blender-smoke.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Jiangnan.blend'
      - 'jiangnan.py'
      - 'tools/**'
      - 'textures/**'
      - '.github/workflows/blender-smoke.yml'
  workflow_dispatch:

jobs:
  blender-scene-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Cache Blender
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/blender-4.5.14
          key: blender-linux-x64-4.5.14

      - name: Install Blender 4.5.14 LTS
        if: steps.blender-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "${RUNNER_TOOL_CACHE}/blender-4.5.14"
          curl --fail --location --retry 3             "https://download.blender.org/release/Blender4.5/blender-4.5.14-linux-x64.tar.xz"             -o "${RUNNER_TEMP}/blender.tar.xz"
          tar -xJf "${RUNNER_TEMP}/blender.tar.xz"             --strip-components=1             -C "${RUNNER_TOOL_CACHE}/blender-4.5.14"

      - name: Blender version
        run: '"${RUNNER_TOOL_CACHE}/blender-4.5.14/blender" --version'

      - name: Execute scene assertions in Blender
        env:
          JN_SKIP_RENDER: '1'
          JN_OUT: ${{ runner.temp }}/jiangnan-smoke
        run: |
          mkdir -p "${JN_OUT}"
          "${RUNNER_TOOL_CACHE}/blender-4.5.14/blender"             --background Jiangnan.blend             --python tools/verify_render.py

      - name: Inspect smoke report
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ['RUNNER_TEMP']) / 'jiangnan-smoke' / 'validation' / 'validation.json').read_text(encoding='utf-8'))
          assert report['render_skipped'] is True
          assert report['invalid_object_drivers'] == []
          assert report['isolated_scene_count'] == 1
          assert report['pierced_scholar_stones'] == 3
          assert all(report['motion_changed'].values())
          assert all(report['outward_normals'].values())
          assert len(report['generated_texture_assets']) >= 7
          print(json.dumps({
              'objects': report['objects'],
              'weather_0': report['weather_0'],
              'weather_1': report['weather_1'],
              'drivers_invalid': len(report['invalid_object_drivers']),
              'packed_textures': len(report['generated_texture_assets']),
          }, ensure_ascii=False, indent=2))
          PY
