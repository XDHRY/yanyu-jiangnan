name: Jiangnan Spatial Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - 'jiangnan.py'
      - 'tools/diagnostic_review.py'
      - 'tools/verify_render.py'
      - 'textures/**'
      - '.github/workflows/spatial-diagnostic.yml'
  workflow_dispatch:

jobs:
  spatial-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install headless graphics runtime
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            xvfb xauth libegl1 libgl1 libglx-mesa0 libegl-mesa0 mesa-vulkan-drivers

      - name: Cache Blender
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/blender-4.5.14
          key: blender-linux-x64-4.5.14

      - name: Install Blender 4.5.14 LTS
        if: steps.blender-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "${RUNNER_TOOL_CACHE}/blender-4.5.14"
          curl --fail --location --retry 3 "https://download.blender.org/release/Blender4.5/blender-4.5.14-linux-x64.tar.xz" -o "${RUNNER_TEMP}/blender.tar.xz"
          tar -xJf "${RUNNER_TEMP}/blender.tar.xz" --strip-components=1 -C "${RUNNER_TOOL_CACHE}/blender-4.5.14"

      - name: Rebuild scene
        env:
          JN_OUT: ${{ runner.temp }}/jiangnan-diagnostic
        run: |
          mkdir -p "${JN_OUT}/textures"
          cp textures/*.png "${JN_OUT}/textures/"
          cp jiangnan.py "${JN_OUT}/jiangnan.py"
          "${RUNNER_TOOL_CACHE}/blender-4.5.14/blender" --background --python-exit-code 1 --python jiangnan.py

      - name: Assert scene without formal renders
        env:
          JN_OUT: ${{ runner.temp }}/jiangnan-diagnostic
        run: |
          "${RUNNER_TOOL_CACHE}/blender-4.5.14/blender" --background "${JN_OUT}/Jiangnan.blend" --python-exit-code 1 --python tools/verify_render.py

      - name: Render ten low-cost diagnostic views
        env:
          JN_OUT: ${{ runner.temp }}/jiangnan-diagnostic
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          xvfb-run -a "${RUNNER_TOOL_CACHE}/blender-4.5.14/blender" --background "${JN_OUT}/Jiangnan.blend" --python-exit-code 1 --python tools/diagnostic_review.py

      - name: Validate diagnostic manifest
        env:
          JN_OUT: ${{ runner.temp }}/jiangnan-diagnostic
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['JN_OUT'])/'diagnostics'
          m=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          assert len(m['views']) == 10
          assert len({v['file'] for v in m['views']}) == 10
          evidence=m['spatial_evidence']
          assert len(evidence['stepping_stones']) == 12
          assert len(evidence['moon_gate_path']) == 7
          assert len(evidence['pavilion_steps']) == 3
          assert len(evidence['waterside_steps']) == 3
          for key,pts in evidence.items():
              assert all(len(p)==3 for p in pts), (key,pts)
              assert any(any(abs(c)>1e-6 for c in p) for p in pts), f'{key} contains only origin placeholders'
          assert all(b[1] > a[1] for a,b in zip(evidence['moon_gate_path'],evidence['moon_gate_path'][1:]))
          missing=[v['file'] for v in m['views'] if not (root/v['file']).exists()]
          assert not missing, missing
          tiny=[v['file'] for v in m['views'] if (root/v['file']).stat().st_size < 1024]
          assert not tiny, f'empty/tiny diagnostic images: {tiny}'
          print('diagnostic views OK', [(v['file'], (root/v['file']).stat().st_size) for v in m['views']])
          PY

      - name: Publish spatial diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jiangnan-Spatial-Diagnostics-${{ github.sha }}
          path: ${{ runner.temp }}/jiangnan-diagnostic/diagnostics/
          if-no-files-found: error
          compression-level: 6
          retention-days: 14
