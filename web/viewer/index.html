<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>烟雨江南 · 全景巡游</title><style>
*{box-sizing:border-box}html,body,#viewport{margin:0;width:100%;height:100%;overflow:hidden;background:#0f1717;color:#eee;font-family:system-ui,-apple-system,"PingFang SC",sans-serif}button,input{font:inherit}#viewport canvas{display:block;touch-action:none}.panel{position:fixed;z-index:5;background:rgba(15,25,25,.82);backdrop-filter:blur(14px);border:1px solid rgba(226,216,190,.2);box-shadow:0 12px 40px #0005}.top{left:12px;right:12px;top:max(12px,env(safe-area-inset-top));padding:10px 12px;border-radius:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.brand{font-family:"Songti SC",serif;font-size:18px;letter-spacing:2px;margin-right:8px}.status{color:#b9cbc5;font-size:12px;margin-left:auto}.toolbar button{border:1px solid #56645d;background:#24322f;color:#e8e2d3;border-radius:8px;padding:7px 10px}.toolbar button.active{background:#876b43;border-color:#c4a46d}.side{right:12px;top:78px;bottom:70px;width:min(300px,42vw);padding:12px;border-radius:12px;overflow:auto}.side h3{margin:4px 0 8px;font:18px "Songti SC",serif}.side p{font-size:12px;color:#aec0ba}.presets{display:grid;gap:6px}.presets button{background:#172421;color:#ddd;border:1px solid #34443f;border-radius:7px;padding:8px;text-align:left}.presets button:hover{background:#263732}.bottom{left:12px;bottom:max(12px,env(safe-area-inset-bottom));padding:8px 10px;border-radius:10px;font-size:12px;color:#c8d5d0;max-width:min(660px,calc(100vw - 24px))}.loading{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#0f1717;transition:.5s}.loading.done{opacity:0;pointer-events:none}.loading.error{background:#2b1515}.loading>div{text-align:center}.seal{width:62px;height:62px;margin:auto;border:2px solid #9e3d32;color:#d8b6a7;display:grid;place-items:center;font:26px "Songti SC",serif;transform:rotate(-2deg)}#flypad{display:none;position:fixed;left:14px;bottom:90px;z-index:7;grid-template-columns:repeat(3,48px);gap:5px}#flypad.show{display:grid}#flypad button{height:48px;border-radius:12px;border:1px solid #738078;background:#1b2927cc;color:#eee;font-size:20px;touch-action:none}#flypad .blank{visibility:hidden}.speed{display:flex;align-items:center;gap:6px;margin-top:10px}.speed input{width:120px}dialog{border:1px solid #4d5d56;background:#111b1a;color:#eee;width:min(1000px,96vw);height:min(82vh,800px);padding:12px;border-radius:12px}dialog::backdrop{background:#000b}.diagGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.diagGrid button{background:#1c2926;border:0;color:#ddd;padding:0}.diagGrid img{width:100%;display:block}.diagGrid span{display:block;padding:6px;font-size:11px}#diagLarge{max-width:100%;max-height:48vh;display:block;margin:8px auto}#diagBtn[hidden]{display:none}@media(max-width:760px){.side{top:auto;left:12px;right:12px;bottom:70px;width:auto;max-height:34vh}.top .status{width:100%;margin-left:0}.brand{width:100%}.diagGrid{grid-template-columns:repeat(2,1fr)}.bottom{display:none}}
</style></head><body><div id="viewport"></div><div id="loading" class="loading"><div><div class="seal">江南</div><p id="loadingStatus">准备载入模型…</p></div></div><div class="panel top toolbar"><div class="brand">烟雨江南 · 全景巡游</div><button id="orbit" class="active">轨道观察</button><button id="fly">自由巡游</button><button id="tour">自动巡游</button><button id="fit">总览</button><button id="gridBtn">网格</button><button id="wireBtn">线框</button><button id="fogBtn" class="active">雾感</button><button id="diagBtn" hidden>诊断图</button><span id="status" class="status"></span></div><aside class="panel side"><h3>十六机位</h3><p id="metric">等待模型…</p><div id="presets" class="presets"></div><div class="speed"><span>巡游速度</span><input id="speed" type="range" min="1" max="18" step=".5" value="5"><span id="speedVal">5.0 m/s</span></div><p>双击模型可查看构件名称与坐标。</p><p id="inspect">尚未选择构件</p></aside><div id="flypad"><button class="blank"></button><button data-move="fwd">▲</button><button data-move="up">升</button><button data-move="left">◀</button><button data-move="back">▼</button><button data-move="right">▶</button><button class="blank"></button><button data-move="down">降</button><button class="blank"></button></div><div class="panel bottom">桌面：轨道模式左键旋转 / 右键平移 / 滚轮缩放；自由巡游使用 WASD、Q/E 升降、Shift 加速并拖动画面转向。手机：单指/双指轨道观察，或切换“自由巡游”后使用方向键并拖动画面。</div><dialog id="diag"><button onclick="this.closest('dialog').close()">关闭诊断图</button><h3 id="diagCaption">16 张 Blender 实图</h3><img id="diagLarge"><div id="diagGrid" class="diagGrid"></div></dialog><script src="./app.bundle.js"></script></body></html>
